<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pdfcodes preview</title>
    <script>
      (function () {
        var stored = localStorage.getItem('theme')
        // Vite substitutes VITE_LIGHT_MODE below; when unset the raw token
        // remains and we fall back to the system color scheme. The comparison
        // string is concatenated so Vite doesn't substitute it too.
        var envLight = '%VITE_LIGHT_MODE%'
        var envUnset = envLight === '%' + 'VITE_LIGHT_MODE' + '%'
        var dark = stored === 'dark' || (stored !== 'light' && (envUnset
          ? window.matchMedia('(prefers-color-scheme: dark)').matches
          : envLight === 'false' || envLight === '0'))
        if (dark) document.documentElement.classList.add('dark')
      })()
    </script>
    <script>
      // Settings handed over by the host page. A gallery of saved presets (the
      // Laravel page listing each .zip by its thumbnail) links here and serves
      // this file through a controller that replaces the marker below with a
      // descriptor, e.g. {"url":"/etichete/presetari/flori-2026.zip","name":"Flori 2026"}.
      // The app then downloads that archive and opens with its settings applied.
      // Left as null when the app is opened directly — see the reference
      // implementation in scripts/laravel-preset-gallery.php.
      window.__PDFCODES_PRESET__ = null /* pdfcodes:preset */
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
